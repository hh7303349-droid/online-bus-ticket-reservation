<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Buses - BusBook</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>🚌 BusBook - Admin Panel</h1>

        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="buses.html">
                Manage Buses
            </a>

            <a href="bookings.html">
                Bookings
            </a>

            <a href="users.html">
                Users
            </a>

            <a href="#" onclick="adminLogout()">
                Logout
            </a>

        </nav>

    </header>


    <!-- MANAGE BUSES -->

    <section class="container">

        <h2>🚌 Manage Buses</h2>

        <p>Add and manage available buses.</p>

        <br>


        <!-- ADD BUS -->

        <div class="login-box">

            <h3>➕ Add New Bus</h3>

            <br>

            <label>Bus Name</label>

            <input
                type="text"
                id="busName"
                placeholder="Enter bus name">

            <br><br>

            <label>From</label>

            <input
                type="text"
                id="busFrom"
                placeholder="Departure city">

            <br><br>

            <label>To</label>

            <input
                type="text"
                id="busTo"
                placeholder="Destination city">

            <br><br>

            <label>Price</label>

            <input
                type="number"
                id="busPrice"
                placeholder="Enter ticket price">

            <br><br>

            <button onclick="addBus()">
                Add Bus
            </button>

        </div>


        <br><br>


        <!-- BUS LIST -->

        <h3>📋 Available Buses</h3>

        <br>

        <div id="busList"></div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 BusBook - Admin Panel
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        // Check Admin Login

        if (localStorage.getItem("adminLogin") !== "true") {

            alert("Please login as Admin.");

            window.location.href =
                "admin-login.html";

        }


        // Default buses

        let buses = JSON.parse(localStorage.getItem("buses"));

if (!buses) {

    buses = [
        {
            name: "Express Travels",
            from: "Madurai",
            to: "Chennai",
            price: 650
        },

        {
            name: "City Rider",
            from: "Madurai",
            to: "Chennai",
            price: 450
        }
    ];

    localStorage.setItem("buses", JSON.stringify(buses));
}


        // Display buses

        function displayBuses() {

            let busList =
                document.getElementById("busList");

            busList.innerHTML = "";


            if (buses.length === 0) {

                busList.innerHTML =
                    "<p>No buses available.</p>";

                return;
            }


            buses.forEach(function(bus, index) {

                let card =
                    document.createElement("div");

                card.className = "bus-card";


                card.innerHTML = `

                    <div class="bus-info">

                        <h3>🚌 ${bus.name}</h3>

                        <p>
                            Route:
                            ${bus.from}
                            →
                            ${bus.to}
                        </p>

                        <p>
                            Ticket Price:
                            ₹${bus.price}
                        </p>

                    </div>

                    <div>

                        <button
                            onclick="deleteBus(${index})">

                            ❌ Delete

                        </button>

                    </div>

                `;


                busList.appendChild(card);

            });

        }


        // Add Bus

        function addBus() {

            let name =
                document.getElementById("busName").value;

            let from =
                document.getElementById("busFrom").value;

            let to =
                document.getElementById("busTo").value;

            let price =
                document.getElementById("busPrice").value;


            if (
                name === "" ||
                from === "" ||
                to === "" ||
                price === ""
            ) {

                alert("Please fill all bus details.");

                return;
            }


            let newBus = {

                name: name,
                from: from,
                to: to,
                price: price

            };


            buses.push(newBus);


            localStorage.setItem(
                "buses",
                JSON.stringify(buses)
            );


            alert("Bus added successfully!");


            document.getElementById("busName").value = "";
            document.getElementById("busFrom").value = "";
            document.getElementById("busTo").value = "";
            document.getElementById("busPrice").value = "";


            displayBuses();

        }


        // Delete Bus

        function deleteBus(index) {

            let result =
                confirm(
                    "Are you sure you want to delete this bus?"
                );


            if (result) {

                buses.splice(index, 1);


                localStorage.setItem(
                    "buses",
                    JSON.stringify(buses)
                );


                displayBuses();

                alert("Bus deleted successfully!");

            }

        }


        // Logout

        function adminLogout() {

            localStorage.removeItem("adminLogin");

            alert("Admin logged out successfully!");

            window.location.href =
                "admin-login.html";

        }


        // Load buses

        displayBuses();

    </script>

</body>

</html>
